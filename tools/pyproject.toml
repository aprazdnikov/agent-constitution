[project]
name = "ac-tools"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["pyyaml>=6.0.2"]

[project.scripts]
ac-check = "ac_tools.cli:run"

[dependency-groups]
dev = ["pytest>=8.4", "mypy>=1.18", "ruff>=0.13", "types-pyyaml>=6.0.12"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "ANN", "S", "PL", "C4", "RET", "ERA"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S603"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
